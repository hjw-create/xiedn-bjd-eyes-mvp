    <h1 class="title">我们不做工厂：小样能帮什么、不能帮什么</h1>
    <div class="warn"><strong>红线写在最前：</strong>只做14/16mm小样；不做娃衣大件；不承诺工厂级量产；不包邮全球速达。</div>
    <p class="p">有人原话：「画饼量产我不敢信。」也有人说：「小样可以，别一上来保证一周到货。」</p>
    <p class="p"><strong>能帮你的</strong>：对齐尺寸/瞳色/瞳纹；记下同款娃想换哪种眼神；一页纸、人话、同圈也能勾。</p>
    <p class="p"><strong>不能帮你的</strong>：不做娃衣大件、不承诺工厂级量产、不保证交期、不绑全色号套餐。</p>
    <p class="p">红线清楚，你再决定要不要试看小样。</p>
